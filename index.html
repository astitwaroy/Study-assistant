<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn your notes into flashcards and quizzes, then drill the ones you miss." />
    <meta name="theme-color" content="#e6ebef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151b22" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Recall — study from your notes</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('recall:theme');
          var theme = saved === '"dark"' || saved === '"light"' ? JSON.parse(saved) : null;
          if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
