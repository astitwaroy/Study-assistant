# Render Blueprint: New → Blueprint in the Render dashboard, pick this repo.
# Render asks for LLM_API_KEY on the first deploy; it is never stored in Git.
services:
  - type: web
    name: recall-study-assistant
    runtime: node
    plan: free
    # devDependencies (Vite) are needed to build the frontend.
    buildCommand: npm ci --include=dev && npm run build
    # One process serves the built app and the API.
    startCommand: npm run serve
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      # Render's load balancer sits in front of the app.
      - key: TRUST_PROXY
        value: "1"
      # Keep the "Test failure handling" panel on the public demo. It only
      # drives the built-in mock and never calls the real model.
      - key: ALLOW_SIMULATE
        value: "true"
